<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NutriTrack</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }
    input, button, select {
      padding: 8px;
      margin: 5px;
    }
    .section {
      margin-bottom: 30px;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      padding: 6px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>NutriTrack</h1>

    <div class="section">
      <h2>Add Item to Lookup</h2>
      <form id="lookup-form">
        <input type="text" id="lookup-name" placeholder="Food name" required>
        <input type="number" id="lookup-calories" placeholder="Calories (kcal)" required>
        <input type="number" id="lookup-protein" placeholder="Protein (g)" required>
        <button type="submit">Add to Lookup</button>
      </form>
    </div>

    <div class="section">
      <h2>Lookup Table</h2>
      <ul id="lookup-table"></ul>
    </div>

    <div class="section">
      <h2>Log Today's Intake</h2>
      <form id="log-form">
        <select id="food-select"></select>
        <input type="number" id="log-quantity" placeholder="Quantity" value="1" required>
        <button type="submit">Add to Today</button>
      </form>
    </div>

    <div class="section">
      <h2>Today's Entries</h2>
      <ul id="today-log"></ul>
      <p id="today-summary"></p>
    </div>

    <div class="section">
      <h2>View Entries by Date</h2>
      <input type="date" id="date-picker">
      <ul id="selected-date-log"></ul>
      <p id="selected-date-summary"></p>
    </div>

    <div class="section">
      <h2>Average Intake</h2>
      <input type="date" id="start-date"> to
      <input type="date" id="end-date">
      <button onclick="viewAverage()">View Average</button>
      <p id="average-summary"></p>
    </div>
  </div>

  <script>
    const lookupKey = 'nutritrack-lookup';
    const logKey = 'nutritrack-logs';

    function getToday() {
      return new Date().toISOString().split('T')[0];
    }

    function getLookup() {
      return JSON.parse(localStorage.getItem(lookupKey)) || [];
    }

    function saveLookup(data) {
      localStorage.setItem(lookupKey, JSON.stringify(data));
    }

    function getLogs() {
      return JSON.parse(localStorage.getItem(logKey)) || {};
    }

    function saveLogs(data) {
      localStorage.setItem(logKey, JSON.stringify(data));
    }

    function updateLookupUI() {
      const table = document.getElementById('lookup-table');
      const select = document.getElementById('food-select');
      table.innerHTML = '';
      select.innerHTML = '';
      const lookup = getLookup();
      lookup.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.name} - ${item.calories} kcal, ${item.protein}g protein`;
        table.appendChild(li);

        const option = document.createElement('option');
        option.value = item.name;
        option.textContent = item.name;
        select.appendChild(option);
      });
    }

    document.getElementById('lookup-form').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('lookup-name').value;
      const calories = +document.getElementById('lookup-calories').value;
      const protein = +document.getElementById('lookup-protein').value;
      const lookup = getLookup();
      lookup.push({ name, calories, protein });
      saveLookup(lookup);
      updateLookupUI();
      e.target.reset();
    });

    document.getElementById('log-form').addEventListener('submit', e => {
      e.preventDefault();
      const foodName = document.getElementById('food-select').value;
      const quantity = +document.getElementById('log-quantity').value;
      const item = getLookup().find(i => i.name === foodName);
      const today = getToday();
      const logs = getLogs();
      logs[today] = logs[today] || [];
      logs[today].push({ name: foodName, calories: item.calories * quantity, protein: item.protein * quantity });
      saveLogs(logs);
      updateTodayLog();
      e.target.reset();
    });

    function updateTodayLog() {
      const today = getToday();
      const logs = getLogs()[today] || [];
      const list = document.getElementById('today-log');
      const summary = document.getElementById('today-summary');
      list.innerHTML = '';
      let totalCal = 0, totalProtein = 0;
      logs.forEach(entry => {
        totalCal += entry.calories;
        totalProtein += entry.protein;
        const li = document.createElement('li');
        li.textContent = `${entry.name} - ${entry.calories} kcal, ${entry.protein}g protein`;
        list.appendChild(li);
      });
      summary.textContent = `Total: ${totalCal} kcal, ${totalProtein}g protein`;
    }

    document.getElementById('date-picker').addEventListener('change', e => {
      const date = e.target.value;
      const logs = getLogs()[date] || [];
      const list = document.getElementById('selected-date-log');
      const summary = document.getElementById('selected-date-summary');
      list.innerHTML = '';
      let totalCal = 0, totalProtein = 0;
      logs.forEach(entry => {
        totalCal += entry.calories;
        totalProtein += entry.protein;
        const li = document.createElement('li');
        li.textContent = `${entry.name} - ${entry.calories} kcal, ${entry.protein}g protein`;
        list.appendChild(li);
      });
      summary.textContent = `Total: ${totalCal} kcal, ${totalProtein}g protein`;
    });

    function viewAverage() {
      const start = document.getElementById('start-date').value;
      const end = document.getElementById('end-date').value;
      const logs = getLogs();
      const dates = Object.keys(logs).filter(date => date >= start && date <= end);
      let totalCal = 0, totalProtein = 0, days = dates.length;
      dates.forEach(date => {
        logs[date].forEach(entry => {
          totalCal += entry.calories;
          totalProtein += entry.protein;
        });
      });
      const avg = document.getElementById('average-summary');
      if (days > 0) {
        avg.textContent = `Average: ${Math.round(totalCal/days)} kcal, ${Math.round(totalProtein/days)}g protein per day`;
      } else {
        avg.textContent = 'No data for selected period.';
      }
    }

    updateLookupUI();
    updateTodayLog();
  </script>
</body>
</html>
