
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Feed</title>
</head>
<body>
  <h2>Add Feed Entry</h2>
  <form id="feedForm">
    <label>Date: <input type="date" id="date" required></label><br>
    <label>Feed Number: <input type="number" id="feedNumber" required></label><br>
    <label>Item: <input type="text" id="item" required></label><br>
    <label>Quantity: <input type="number" id="quantity" required></label><br>
    <button type="submit">Add Feed</button>
  </form>
  <button onclick="location.href='index.html'">Back</button>

  <script>
    document.getElementById('date').value = new Date().toISOString().split('T')[0];
    document.getElementById('feedForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const date = document.getElementById('date').value;
      const feedNumber = document.getElementById('feedNumber').value;
      const item = document.getElementById('item').value;
      const quantity = parseFloat(document.getElementById('quantity').value);
      const logs = JSON.parse(localStorage.getItem('logs') || '[]');
      logs.push({ date, feedNumber, item, quantity });
      localStorage.setItem('logs', JSON.stringify(logs));
      alert("Feed added!");
      this.reset();
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
    });
  </script>
</body>
</html>
