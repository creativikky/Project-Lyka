
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Feed by Date</title>
</head>
<body>
  <h2>View Feed Chart by Date</h2>
  <input type="date" id="dateInput">
  <button onclick="showFeeds()">Show</button>
  <table border="1">
    <thead>
      <tr>
        <th>Feed #</th>
        <th>Item</th>
        <th>Quantity</th>
        <th>Energy</th>
        <th>Protein</th>
      </tr>
    </thead>
    <tbody id="feedTable"></tbody>
  </table>
  <button onclick="location.href='index.html'">Back</button>

  <script>
    document.getElementById('date').value = new Date().toISOString().split('T')[0];
    function showFeeds() {
      const selectedDate = document.getElementById('dateInput').value;
      const logs = JSON.parse(localStorage.getItem('logs') || '[]');
      const lookup = JSON.parse(localStorage.getItem('lookup') || '{}');
      const tbody = document.getElementById('feedTable');
      tbody.innerHTML = '';

      logs.filter(l => l.date === selectedDate).forEach(l => {
        const row = document.createElement('tr');
        const ref = lookup[l.item];
        const factor = ref ? l.quantity / ref.quantity : 1;
        const energy = ref ? (ref.calories * factor).toFixed(0) : 'N/A';
        const protein = ref ? (ref.protein * factor).toFixed(1) : 'N/A';

        row.innerHTML = `
          <td>${l.feedNumber}</td>
          <td>${l.item}</td>
          <td>${l.quantity}</td>
          <td>${energy}</td>
          <td>${protein}</td>
        `;
        tbody.appendChild(row);
      });
    }
  </script>
</body>
</html>
