<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View/Edit Lookup Table</title>
</head>
<body>
  <h2>Add or Edit Ingredient</h2>
  <form id="itemForm">
    <label>Item name: <input type="text" id="name" required></label><br>
    <label>Quantity: <input type="number" step="any" id="quantity" required></label><br>
    <label>Equivalent: <input type="text" id="equivalent" required></label><br>
    <label>Calories: <input type="number" step="any" id="calories" required></label><br>
    <label>Protein: <input type="number" step="any" id="protein" required></label><br>
    <button type="submit">Save Item</button>
  </form>

  <h3>Current Lookup Table</h3>
  <table border="1">
    <thead>
      <tr><th>Item</th><th>Quantity</th><th>Equivalent</th><th>Calories</th><th>Protein</th><th>Actions</th></tr>
    </thead>
    <tbody id="lookupTable"></tbody>
  </table>

  <button onclick="location.href='index.html'">Back</button>

  <script>
    const form = document.getElementById('itemForm');
    const table = document.getElementById('lookupTable');
    let lookup = JSON.parse(localStorage.getItem('lookup') || '{}');

    function normalizeKey(name) {
      return name.toLowerCase().replace(/\s+/g, '');
    }

    function refreshTable() {
      table.innerHTML = '';
      for (const [key, val] of Object.entries(lookup)) {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${val.displayName}</td>
          <td>${val.quantity}</td>
          <td>${val.equivalent}</td>
          <td>${val.calories}</td>
          <td>${val.protein}</td>
          <td>
            <button onclick="loadItem('${key}')">Edit</button>
            <button onclick="deleteItem('${key}')">Delete</button>
          </td>
        `;
        table.appendChild(row);
      }
    }

    function loadItem(key) {
      const item = lookup[key];
      document.getElementById('name').value = item.displayName;
      document.getElementById('quantity').value = item.quantity;
      document.getElementById('equivalent').value = item.equivalent;
      document.getElementById('calories').value = item.calories;
      document.getElementById('protein').value = item.protein;
    }

    function deleteItem(key) {
      if (confirm("Are you sure you want to delete this item?")) {
        delete lookup[key];
        localStorage.setItem('lookup', JSON.stringify(lookup));
        refreshTable();
      }
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const normalized = normalizeKey(name);
      const quantity = parseFloat(document.getElementById('quantity').value);
      const equivalent = document.getElementById('equivalent').value;
      const calories = parseFloat(document.getElementById('calories').value);
      const protein = parseFloat(document.getElementById('protein').value);

      lookup[normalized] = {
        displayName: name,
        quantity,
        equivalent,
        calories,
        protein
      };
      localStorage.setItem('lookup', JSON.stringify(lookup));
      refreshTable();
      alert("Item added/updated!");
      form.reset();
    });

    refreshTable();
  </script>
</body>
</html>
